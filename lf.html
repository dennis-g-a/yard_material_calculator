<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lineal Foot Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  </head>
  <body>
    <nav class="navbar bg-body-tertiary fixed-top">

        <div class="container-fluid">
            <a class="navbar-brand" href="#">Lineal Foot Calculator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">

                <div class="offcanvas-header">
                    <a class="navbar-brand" href="#">Yard Material Calculator</a>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="mbf.html">MBF Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="msf.html">Sheet Goods</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="lf.html">L/F Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-info btn-lg w-100" href="up.html">Unit/Piece</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cs.html">Concrete Slab</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cp.html">Concrete Post</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="gr.html">Gravel/Rock</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="sm.html">Soil/Mulch</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="decking.html">Decking</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="siding.html">Siding</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-2">
            <div class="col-lg-5 col-md-8 col-sm-12 p-2 rounded mt-5">
                <div id="pricingOutput">
                    <span class="fw-semibold">Cost</span>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">LF</span>
                        <div class="form-control" id="lfcostInput"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="pccostInput"></div>
                    </div>
                    <span class="fw-semibold">Retail</span>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">LF</span>
                        <div class="form-control" id="lfretailInput"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="pcretailInput"></div>
                    </div>
                    <span class="fw-semibold">Discount</span>
                    <div class="input-group">
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">LF</span>
                        <div class="form-control" id="lfdiscountInput"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="pcdiscountInput"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 col-sm-12 bg-body-tertiary p-sm-3 rounded mt-3">
                <div class="row">
                    <div class="col-6">
                        <label for="inputPrice" class="form-label">Price per Foot</label>
                        <input type="number" class="form-control" id="inputPrice" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="inputLength" class="form-label">Length</label>
                        <input type="number" class="form-control" id="inputLength" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="inputRetail" class="form-label">Retail Markup</label>
                        <input type="number" class="form-control" id="inputRetail" value="1.50" step=".01">
                    </div>
                    <div class=" col-6">
                        <label for="inputDiscount" class="form-label">Discount Markup</label>
                        <input type="number" class="form-control" id="inputDiscount" value="1.35" step=".01">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class=" col-6">
                        <button type="button" class="btn btn-outline-success w-100" id="btnClear">Clear</button>
                    </div>
                    <div class=" col-6">
                        <button type="button" class="btn btn-success w-100" id="btnCalc">Calculate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

        const btnClear = document.querySelector("#btnClear");
        const btnCalc = document.querySelector("#btnCalc");

        const lfcostInput = document.querySelector("#lfcostInput");
        const lfretailInput = document.querySelector("#lfretailInput");
        const lfdiscountInput = document.querySelector("#lfdiscountInput");
        const pccostInput = document.querySelector("#pccostInput");
        const pcretailInput = document.querySelector("#pcretailInput");
        const pcdiscountInput = document.querySelector("#pcdiscountInput");
        
        const inputLength = document.querySelector("#inputLength");
        const inputPrice = document.querySelector("#inputPrice");
        const inputRetail = document.querySelector("#inputRetail");
        const inputDiscount = document.querySelector("#inputDiscount");


        btnClear.addEventListener("click", ()=>{
            lfcostInput.innerHTML = '';
            pccostInput.innerHTML = '';
            lfretailInput.innerHTML = '';
            pcretailInput.innerHTML = '';
            lfdiscountInput.innerHTML = '';
            pcdiscountInput.innerHTML = '';

            inputLength.value = '';
            inputPrice.value = '';
        })

        btnCalc.addEventListener("click", ()=>{
            lfcostInput.innerHTML = '';
            pccostInput.innerHTML = '';
            lfretailInput.innerHTML = '';
            pcretailInput.innerHTML = '';
            lfdiscountInput.innerHTML = '';
            pcdiscountInput.innerHTML = '';

            const l = Number(inputLength.value)
            const bfm = Number(inputPrice.value)
            const r = Number(inputRetail.value)
            const d = Number(inputDiscount.value)

            
            const lfc = bfm
            const lfr = lfc * r
            const lfd = lfc * d

            let lcs = `$${lfc.toFixed(3)}`
            let lrs = `$${lfr.toFixed(2)}`
            let lds = `$${lfd.toFixed(2)}`
            let pcs = ``
            let prs = ``
            let pds = ``

            if(l > 0){
                const pc = lfc * l
                const pr = lfr * l
                const pd = lfd * l 

                pcs = `$${pc.toFixed(3)}`
                prs = `$${pr.toFixed(2)}`
                pds = `$${pd.toFixed(2)}`
            }

            let slfc,slfr,spcc,spcr,slfd,spcd = ''

            const elarr = [
                [slfc,lcs,lfcostInput],
                [spcc,pcs,pccostInput],
                [slfr,lrs,lfretailInput],
                [spcr,prs,pcretailInput],
                [slfd,lds,lfdiscountInput],
                [spcd,pds,pcdiscountInput]
            ]

            for(const v of elarr){
                v[0] = document.createElement('span');
                v[0].classList.add("fw-semibold");
                v[0].innerText = v[1],
                v[2].append(v[0])
            }

        })


    </script>
  </body>
</html>
