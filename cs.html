<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concrete Slab Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  </head>
  <body>
    <nav class="navbar bg-body-tertiary fixed-top">

        <div class="container-fluid">
            <a class="navbar-brand" href="#">Concrete Slab Calculator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">

                <div class="offcanvas-header">
                    <a class="navbar-brand" href="#">Yard Material Calculator</a>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="mbf.html">MBF Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="msf.html">Sheet Goods</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="lf.html">L/F Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-info btn-lg w-100" href="up.html">Unit/Piece</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cs.html">Concrete Slab</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cp.html">Concrete Post</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="gr.html">Gravel/Rock</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="sm.html">Soil/Mulch</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="decking.html">Decking</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="siding.html">Siding</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-3">
            <div class="col-lg-5 col-md-8 col-sm-12 p-2 rounded mt-5">
                <div id="pricingOutput">
                    <span class="fw-semibold">Total Bags</span>
                    <div class="row">
                        <div class="col-6">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-success text-bg-success" id="basic-addon3">50LB</span>
                                <div class="form-control" id="lb50"></div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-success text-bg-success" id="basic-addon3">60Lb</span>
                                <div class="form-control" id="lb60"></div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-success text-bg-success" id="basic-addon3">80Lb</span>
                                <div class="form-control" id="lb80"></div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-success text-bg-success" id="basic-addon3">90Lb</span>
                                <div class="form-control" id="lb90"></div>
                            </div>
                        </div>
                    </div>
                    <span class="fw-semibold">Total Volume</span>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">CU FT</span>
                        <div class="form-control" id="cuft"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">CU YD</span>
                        <div class="form-control" id="cuyd"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 col-sm-12 bg-body-tertiary p-sm-3 rounded mt-3">
                <div class="row">
                    <div class="col-6">
                        <label for="inputWidth" class="form-label">Width in Feet</label>
                        <input type="number" class="form-control" id="inputWidth" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="inputLength" class="form-label">Length in Feet</label>
                        <input type="number" class="form-control" id="inputLength" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="inputDepth" class="form-label">Depth in Inches</label>
                        <input type="number" class="form-control" id="inputDepth" placeholder="0">
                    </div>
                    <div class="col-6">
                        
                    </div>
                </div>
                <div class="row mt-3">
                    <div class=" col-6">
                        <button type="button" class="btn btn-outline-success w-100" id="btnClear">Clear</button>
                    </div>
                    <div class=" col-6">
                        <button type="button" class="btn btn-success w-100" id="btnCalc">Calculate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

        const btnClear = document.querySelector("#btnClear");
        const btnCalc = document.querySelector("#btnCalc");

        const lb50 = document.querySelector("#lb50");
        const lb60 = document.querySelector("#lb60");
        const lb80 = document.querySelector("#lb80");
        const lb90 = document.querySelector("#lb90");
        const cuft = document.querySelector("#cuft");
        const cuyd = document.querySelector("#cuyd");
        
        const inputDepth = document.querySelector("#inputDepth");
        const inputWidth = document.querySelector("#inputWidth");
        const inputLength = document.querySelector("#inputLength");


        btnClear.addEventListener("click", ()=>{
            lb50.innerHTML = '';
            lb60.innerHTML = '';
            lb80.innerHTML = '';
            lb90.innerHTML = '';
            cuft.innerHTML = '';
            cuyd.innerHTML = '';

            inputDepth.value = '';
            inputWidth.value = '';
            inputLength.value = '';
        })

        btnCalc.addEventListener("click", ()=>{
            lb50.innerHTML = '';
            lb60.innerHTML = '';
            lb80.innerHTML = '';
            lb90.innerHTML = '';
            cuft.innerHTML = '';
            cuyd.innerHTML = '';

            const d = Number(inputDepth.value) / 12
            const sqft = Number(inputWidth.value) * Number(inputLength.value)
            const cft = (sqft * d) + .10
            const cyd = cft / 27

            const nSpan = document.createElement("span")
            lb50.append(nSpan, Math.ceil(cft / 0.375))
            lb60.append(nSpan, Math.ceil(cft / 0.45))
            lb80.append(nSpan, Math.ceil(cft / 0.60))
            lb90.append(nSpan, Math.ceil(cft / 0.675))
            cuft.append(nSpan, cft.toFixed(2))
            cuyd.append(nSpan, cyd.toFixed(2))

        })


    </script>
  </body>
</html>
