  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unit/Piece Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  </head>
  <body>
    <nav class="navbar bg-body-tertiary fixed-top">

        <div class="container-fluid">
            <a class="navbar-brand" href="#">Unit/Piece Calculator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">

                <div class="offcanvas-header">
                    <a class="navbar-brand" href="#">Yard Material Calculator</a>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="mbf.html">MBF Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="msf.html">Sheet Goods</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-success btn-lg w-100" href="lf.html">L/F Lumber</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-info btn-lg w-100" href="up.html">Unit/Piece</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cs.html">Concrete Slab</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-secondary btn-lg w-100" href="cp.html">Concrete Post</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="gr.html">Gravel/Rock</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-warning btn-lg w-100" href="sm.html">Soil/Mulch</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="decking.html">Decking</a>
                        </li>
                        <li class="mb-2">
                            <a class="btn btn-primary btn-lg w-100" href="siding.html">Siding</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-lg-5 col-md-8 col-sm-12 p-2 rounded mt-5">
                <div id="pricingOutput">
                    <div class="row">
                        <div class="col-4 fw-semibold">
                            Cost
                        </div>
                        <div class="col-4 fw-semibold">
                            Retail
                        </div>
                        <div class="col-4 fw-semibold">
                            Discount
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="costInput"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="retailInput"></div>
                        <span class="input-group-text bg-success text-bg-success" id="basic-addon3">PC</span>
                        <div class="form-control" id="discountInput"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 col-sm-12 bg-body-tertiary p-sm-3 rounded mt-3">
                <div class="row">
                    <div class="col-12">
                        <label for="inputPrice" class="form-label">Item Cost</label>
                        <input type="number" class="form-control" id="inputPrice" placeholder="0">
                    </div>
                    <div class="col-6">
                        <label for="inputRetail" class="form-label">Retail Markup</label>
                        <input type="number" class="form-control" id="inputRetail" value="1.50" step=".01">
                    </div>
                    <div class=" col-6">
                        <label for="inputDiscount" class="form-label">Discount Markup</label>
                        <input type="number" class="form-control" id="inputDiscount" value="1.35" step=".01">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class=" col-6">
                        <button type="button" class="btn btn-outline-success w-100" id="btnClear">Clear</button>
                    </div>
                    <div class=" col-6">
                        <button type="button" class="btn btn-success w-100" id="btnCalc">Calculate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

        const btnClear = document.querySelector("#btnClear");
        const btnCalc = document.querySelector("#btnCalc");

        const costInput = document.querySelector("#costInput");
        const retailInput = document.querySelector("#retailInput");
        const discountInput = document.querySelector("#discountInput");
        
        const inputPrice = document.querySelector("#inputPrice");
        const inputRetail = document.querySelector("#inputRetail");
        const inputDiscount = document.querySelector("#inputDiscount");


        btnClear.addEventListener("click", ()=>{
            costInput.innerHTML = '';
            retailInput.innerHTML = '';
            discountInput.innerHTML = '';

            inputPrice.value = '';
        })

        btnCalc.addEventListener("click", ()=>{
            costInput.innerHTML = '';
            retailInput.innerHTML = '';
            discountInput.innerHTML = '';

            const p = Number(inputPrice.value)
            const r = Number(inputRetail.value)
            const d = Number(inputDiscount.value)

            
            const sc = p
            const sr = sc * r
            const sd = sc * d

            let cs = `$${sc.toFixed(3)}`
            let rs = `$${sr.toFixed(2)}`
            let ds = `$${sd.toFixed(2)}`

            let n1,n2,n3 = ''

            const elarr = [
                [n1,cs,costInput],
                [n2,rs,retailInput],
                [n3,ds,discountInput]
            ]

            for(const v of elarr){
                v[0] = document.createElement('span');
                v[0].classList.add("fw-semibold");
                v[0].innerText = v[1],
                v[2].append(v[0])
            }

        })


    </script>
  </body>
</html>
